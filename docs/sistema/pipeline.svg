<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 700" width="980" height="700" role="img"
     aria-label="De la pregunta a la respuesta: BM25 y vector 4B en paralelo, fusion RRF, reranker BGE, boosts deterministas, y dos salidas: modo buscador o resumen con citas verificadas. El monitor semanal de BCN alimenta el corpus.">
  <style>
    :root { color-scheme: light dark; }
    .bg   { fill: #ffffff; }
    .caja { fill: #f3f5f8; stroke: #b4bdc9; }
    .dato { fill: #e8edf4; stroke: #9fb0c6; }
    .sal  { fill: #eef3ec; stroke: #a5bfa0; }
    .t    { fill: #1c2230; font-family: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif; font-size: 14px; }
    .tb   { font-weight: 600; }
    .s    { fill: #5b6676; font-size: 12px; }
    .ln   { stroke: #8795a7; fill: none; stroke-width: 1.6; }
    .eti  { fill: #5b6676; font-size: 11.5px; letter-spacing: .04em; }
    @media (prefers-color-scheme: dark) {
      .bg   { fill: #0d1117; }
      .caja { fill: #1b2230; stroke: #3c4657; }
      .dato { fill: #18222f; stroke: #3a4a60; }
      .sal  { fill: #16241c; stroke: #3a5740; }
      .t    { fill: #e4e8ee; }
      .s    { fill: #9aa5b4; }
      .ln   { stroke: #6a7789; }
      .eti  { fill: #9aa5b4; }
    }
  </style>
  <defs>
    <marker id="f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8795a7"/>
    </marker>
  </defs>
  <rect class="bg" width="980" height="700"/>

  <!-- pregunta -->
  <rect class="caja" x="360" y="18" width="260" height="38" rx="19"/>
  <text class="t tb" x="490" y="42" text-anchor="middle">Pregunta en castellano</text>
  <line class="ln" x1="490" y1="56" x2="490" y2="86" marker-end="url(#f)"/>

  <!-- dos patas -->
  <text class="eti" x="70" y="80">BÚSQUEDA · SimpleRetriever.retrieve</text>
  <rect class="dato" x="70" y="90" width="380" height="76" rx="8"/>
  <text class="t tb" x="88" y="114">BM25 — Postgres `tsv`</text>
  <text class="s" x="88" y="134">palabras exactas · pool 50</text>
  <text class="s" x="88" y="152">0.00 s</text>

  <rect class="dato" x="530" y="90" width="380" height="76" rx="8"/>
  <text class="t tb" x="548" y="114">Vector — Qwen3-Embedding-4B (Ollama, CPU)</text>
  <text class="s" x="548" y="134">pgvector `embedding_4b_1024` (prefijo MRL, HNSW)</text>
  <text class="s" x="548" y="152">+ alias coloquial→legal, unidos por RRF · 0.16 s</text>

  <line class="ln" x1="490" y1="86" x2="260" y2="86"/><line class="ln" x1="260" y1="86" x2="260" y2="90" marker-end="url(#f)"/>
  <line class="ln" x1="490" y1="86" x2="720" y2="86"/><line class="ln" x1="720" y1="86" x2="720" y2="90" marker-end="url(#f)"/>
  <line class="ln" x1="260" y1="166" x2="260" y2="192"/><line class="ln" x1="720" y1="166" x2="720" y2="192"/>
  <line class="ln" x1="260" y1="192" x2="720" y2="192"/>
  <line class="ln" x1="490" y1="192" x2="490" y2="214" marker-end="url(#f)"/>

  <!-- fusion -->
  <rect class="caja" x="290" y="218" width="400" height="52" rx="8"/>
  <text class="t tb" x="490" y="240" text-anchor="middle">Fusión RRF → pool de 50</text>
  <text class="s" x="490" y="259" text-anchor="middle">pesos por largo de query · saca derogados, fantasmas y duplicados</text>
  <line class="ln" x1="490" y1="270" x2="490" y2="296" marker-end="url(#f)"/>

  <!-- reranker -->
  <rect class="caja" x="255" y="300" width="470" height="56" rx="8"/>
  <text class="t tb" x="490" y="322" text-anchor="middle">Reranker BGE-reranker-v2-m3: 30 → 10</text>
  <text class="s" x="490" y="341" text-anchor="middle">21.5 s en CPU · 2.9 s en GPU (solo en `--buscar`: en GPU desplaza al LLM)</text>
  <line class="ln" x1="490" y1="356" x2="490" y2="382" marker-end="url(#f)"/>

  <!-- boosts -->
  <rect class="caja" x="230" y="386" width="520" height="56" rx="8"/>
  <text class="t tb" x="490" y="408" text-anchor="middle">Refuerzos deterministas (sin modelo)</text>
  <text class="s" x="490" y="427" text-anchor="middle">grafo de conceptos · glosario exacto · avisa si el término está definido en varias normas</text>
  <line class="ln" x1="490" y1="442" x2="490" y2="466" marker-end="url(#f)"/>

  <!-- 10 articulos -->
  <rect class="dato" x="355" y="470" width="270" height="40" rx="8"/>
  <text class="t tb" x="490" y="495" text-anchor="middle">10 artículos, con su texto</text>

  <!-- bifurcacion -->
  <line class="ln" x1="490" y1="510" x2="490" y2="528"/>
  <line class="ln" x1="215" y1="528" x2="765" y2="528"/>
  <line class="ln" x1="215" y1="528" x2="215" y2="552" marker-end="url(#f)"/>
  <line class="ln" x1="765" y1="528" x2="765" y2="552" marker-end="url(#f)"/>

  <rect class="sal" x="60" y="556" width="310" height="86" rx="8"/>
  <text class="t tb" x="78" y="580">`--buscar` · modo buscador</text>
  <text class="s" x="78" y="600">muestra los 10 con su texto y no redacta nada</text>
  <text class="s" x="78" y="618">13 s por consulta · uso recomendado hoy</text>
  <text class="s" x="78" y="636">recall@10: held-out 64/64 · dev 92/114 · reales 13/16</text>

  <rect class="sal" x="610" y="556" width="310" height="86" rx="8"/>
  <text class="t tb" x="628" y="580">con respuesta · qwen3:30b-a3b local</text>
  <text class="s" x="628" y="600">citas textuales verificadas (substring exacto, máx. 2)</text>
  <text class="s" x="628" y="618">si ninguna calza: prosa con «SIN CITA VERIFICADA»</text>
  <text class="s" x="628" y="636">~79 s · fuentes arriba, resumen abajo «verifíquelo»</text>

  <!-- corpus + monitor -->
  <rect class="dato" x="60" y="218" width="185" height="140" rx="8"/>
  <text class="t tb" x="78" y="242">Corpus</text>
  <text class="s" x="78" y="262">Postgres + pgvector</text>
  <text class="s" x="78" y="280">124 normas · 5.354 artículos</text>
  <text class="s" x="78" y="298">6.611 fragmentos</text>
  <text class="s" x="78" y="322">Monitor BCN LeyChile</text>
  <text class="s" x="78" y="340">lunes 06:00 · hash estable</text>
  <line class="ln" x1="150" y1="218" x2="150" y2="170" marker-end="url(#f)"/>
  <text class="eti" x="60" y="372">las dos patas leen esta misma base</text>

  <text class="eti" x="60" y="676">Todo local: Postgres + pgvector, Ollama, una RTX 3090 con tope de 180 W. Ninguna API pagada.</text>
</svg>
